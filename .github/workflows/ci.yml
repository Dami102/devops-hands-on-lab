name: Build and test 
on: 
    push: 
      branches: [main] 
    pull_request: 
      branches: [main] 
permissions: 
    contents: read 
jobs: 
    build-and-test: 
      runs-on: ubuntu-latest 
      steps: 
        - name: Check out source 
          uses: actions/checkout@v6 
        - name: Set up Node.js 24 
          uses: actions/setup-node@v7 
          with: 
            node-version: 24 
        - name: Run tests 
          run: npm test 
        - name: Build Docker image 
          run: docker build --tag devops-lab:ci .